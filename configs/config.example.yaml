# ============================================================================
# EmmAI Configuration File
# ============================================================================
# Location: ~/.emmai/config.yaml
#
# All settings are optional. Environment variables override config file values.
# ============================================================================

# ----------------------------------------------------------------------------
# API Configuration
# ----------------------------------------------------------------------------

# Optional: OpenAI API key
# 
# REQUIRED for default OpenAI API (https://api.openai.com/v1)
# OPTIONAL for custom endpoints (LocalAI, Ollama, LM Studio, etc.)
#
# Many local/self-hosted APIs don't require authentication.
# You can leave this empty or set an empty string for such endpoints.
#
# Get OpenAI API key: https://platform.openai.com/api-keys
# 
# Environment variable (recommended): OPENAI_API_KEY
#   export OPENAI_API_KEY="sk-..."         # For OpenAI
#   export OPENAI_API_KEY=""               # For LocalAI (empty is OK)
#
# Or set in config file:
#   api_key: sk-...                        # For OpenAI
#   api_key: ""                            # For LocalAI (empty is OK)
#   # (or omit the line entirely)
#
# api_key: sk-...

# Optional: Custom OpenAI API base URL
# Default: https://api.openai.com/v1
#
# The application automatically appends /v1 if not present.
# Examples:
#   http://localhost:8080          → http://localhost:8080/v1
#   http://localhost:8080/v1       → http://localhost:8080/v1
#
# Supported endpoints:
#   - LocalAI:    http://localhost:8080
#   - Ollama:     http://localhost:11434
#   - LM Studio:  http://localhost:1234
#   - Azure:      https://your-resource.openai.azure.com
#
# Environment variables (in order of precedence):
#   1. OPENAI_BASE_URL
#   2. OPENAI_API_BASE (fallback)
#
# base_url: http://localhost:8080

# Optional: Skip TLS certificate verification (for self-signed certificates)
# Default: false
# 
# WARNING: Only enable for development/testing with self-signed certificates!
# This disables SSL/TLS security checks.
#
# Use cases:
#   - Local development with self-signed certificates
#   - Internal corporate proxies with custom CAs
#   - Testing environments
#
# Environment variable: OPENAI_INSECURE_SKIP_VERIFY=true
#
# insecure_skip_verify: false

# ----------------------------------------------------------------------------
# Model Configuration
# ----------------------------------------------------------------------------

# Model to use (default: gpt-3.5-turbo)
#
# OpenAI models:
#   - gpt-4              Most capable
#   - gpt-4-turbo        Faster GPT-4
#   - gpt-3.5-turbo      Fast and economical
#
# LocalAI model examples:
#   - gpt-3.5-turbo      (LocalAI default)
#   - llama-2-7b         (Llama 2)
#   - mistral-7b         (Mistral)
#   - codellama-13b      (Code-specialized)
#
# List available models:
#   curl http://localhost:8080/v1/models
#
model: gpt-3.5-turbo

# ----------------------------------------------------------------------------
# Generation Parameters
# ----------------------------------------------------------------------------

# Temperature: Controls randomness (0.0 - 2.0)
#   0.0-0.3:  Focused, deterministic
#   0.4-0.9:  Balanced (recommended)
#   1.0-2.0:  Creative, diverse
temperature: 0.7

# Maximum tokens per response
#   256:   Short answers
#   1024:  Medium responses
#   2048:  Long responses (default)
#   4096:  Very long (if supported)
max_tokens: 2048

# System prompt: Defines AI behavior and expertise
# Default: Expert software engineer focused on code delivery
# 
# The default prompt guides the AI to:
#   - Follow language-specific best practices and conventions
#   - Write clean, production-ready code with inline comments
#   - Break complex tasks into subtasks before implementing
#   - Provide code solutions directly without verbose explanations
#   - Ask clarifying questions when needed
#
# Customize this to change the AI's personality, expertise, or focus area.
# Examples:
#   - "You are a Python expert. Provide code solutions with minimal explanation."
#   - "You are a DevOps engineer. Write infrastructure code directly."
#   - "You are a code reviewer. Point out issues concisely with fixes."
#
# Leave commented to use the default coding assistant prompt.
#system_prompt: "You are an expert software engineer and coding assistant..."

# ----------------------------------------------------------------------------
# Phase Configuration (State Machine Workflow)
# ----------------------------------------------------------------------------

# Initial phase to start with (default: explore)
# The LLM will automatically start in this phase
initial_phase: explore

# Define workflow phases and their behavior
# Each phase has specific instructions, allowed tools, and transitions to the next phase
#
# Available tools:
#   - list_files: Find files matching glob patterns
#   - read_file: Read file contents
#   - write_file: Write/create files
#   - start_phase: Transition between phases (automatically included, don't configure)
#
phases:
  - name: explore
    read_only: true
    next_phase: plan
    # Tools allowed in this phase (start_phase automatically included)
    allowed_tools:
      - list_files
      - read_file
    prompt: |
      # EXPLORE - Gather Information Only
      
      ⛔ DO NOT write or suggest any code in this phase
      ✅ DO read files and understand what exists
      
      Steps:
      1. list_files("**/*") - check if project is empty
      2. If empty: Report "Empty project - ready for new implementation" → THEN call start_phase("plan")
      3. If not empty: read_file on key files (max 5 files), then report:
         - What type of project is this?
         - What files/structure exists?
         - What does it currently do?
      4. ALWAYS finish by calling: start_phase("plan")
      
      NO code suggestions. Just report facts. Implementation comes later.

  - name: plan
    read_only: true
    next_phase: execute
    # Only read tools available during planning
    allowed_tools:
      - list_files
      - read_file
    prompt: |
      # PLAN - Create Implementation Plan
      
      ⛔ DO NOT write or suggest code snippets
      ⛔ DO NOT read files (already explored in previous phase)
      ✅ DO create a clear, structured implementation plan
      
      Your Task: Based on exploration findings, plan HOW to implement the requested changes.
      
      Plan Structure:
      1. FILES TO MODIFY: List each file with brief purpose
      2. FILES TO CREATE: List each new file with brief purpose
      3. KEY CHANGES: Bullet points of main modifications
      4. POTENTIAL RISKS: Any edge cases or breaking changes
      
      Keep it concise - this is a roadmap, not code.
      
      Steps:
      1. Think through the implementation approach
      2. List files to create/modify
      3. Describe what changes go in each file (1-2 sentences per file)
      4. Ask user: "Does this plan look good? Should I proceed?"
      5. If user approves → call start_phase("execute")
      6. If user has concerns → adjust plan based on feedback
      
      NO code examples. Just describe WHAT will change WHERE. Code comes in execute phase.

  - name: execute
    read_only: false
    next_phase: verify
    # Write tool now available
    allowed_tools:
      - list_files
      - read_file
      - write_file
    prompt: |
      # EXECUTE - Implement Changes
      
      ✅ DO write code and modify files
      ✅ DO follow the plan from previous phase
      ⛔ DO NOT deviate from the plan without user approval
      ⛔ DO NOT skip files or make partial implementations
      
      Your Task: Implement the planned changes exactly as specified.
      
      Execution Rules:
      1. Work through files in order (modify existing first, then create new)
      2. Follow existing code style, patterns, and conventions
      3. Make minimal, focused changes - no scope creep
      4. Read files before editing to understand context
      5. Report progress as you complete each file
      
      Steps:
      1. Review the plan from the previous phase
      2. For each file in the plan:
         a. Read the file (if existing)
         b. Make the planned changes
         c. Report: "✓ Updated [filename] - [brief description]"
      3. When ALL files are complete → call start_phase("verify")
      
      Quality checklist before moving to verify:
      - All planned files created/modified?
      - Code follows existing patterns?
      - No syntax errors introduced?
      - Functionality matches plan?
      
      IMPORTANT: If you encounter issues or need to deviate from the plan, STOP and ask the user first.

  - name: verify
    read_only: true
    next_phase: ""
    # Back to read-only tools
    allowed_tools:
      - list_files
      - read_file
    prompt: |
      # VERIFY - Confirm Implementation Quality
      
      ✅ DO run tests, linters, and builds
      ✅ DO review modified files for correctness
      ⛔ DO NOT modify files (read-only phase)
      ⛔ DO NOT skip verification steps
      
      Your Task: Verify the implementation works correctly and meets requirements.
      
      Verification Checklist:
      1. BUILD: Run build command (make, npm build, go build, etc.)
      2. TESTS: Run test suite if available (make test, npm test, pytest, etc.)
      3. LINT: Run linters/formatters if configured (eslint, gofmt, black, etc.)
      4. REVIEW: Read modified files and check for:
         - Syntax errors or typos
         - Logic matches the plan
         - Code style consistency
         - No unintended changes
      
      Steps:
      1. Run build/compile command → report results
      2. Run tests (if test files exist) → report pass/fail count
      3. Run linters (if config exists) → report warnings/errors
      4. Review each modified file briefly
      5. Create final summary
      
      Final Summary Format:
      ✓ COMPLETED: [List what was implemented]
      ✓ VERIFIED: [Build status, test results, lint status]
      ⚠ ISSUES: [Any problems found, or "None"]
      → NEXT: [Suggest next steps or mark as complete]
      
      If verification fails: Report the issues and ask user how to proceed (fix, rollback, or accept as-is).
      
      This is the final phase. Provide a comprehensive report before completing the task.

# ============================================================================
# LocalAI Setup Guide (Recommended for Privacy & Zero Cost)
# ============================================================================
#
# Why LocalAI?
# -----------
# ✓ Complete privacy - data never leaves your machine
# ✓ Zero cost - no API fees
# ✓ Offline - works without internet
# ✓ No API key needed - simplified setup
# ✓ Full control - choose your models
#
# Quick Start (5 minutes):
# ------------------------
#
# 1. Start LocalAI with Docker:
#
#    CPU version (any machine):
#      docker run -p 8080:8080 --name localai -d \
#        localai/localai:latest-aio-cpu
#
#    GPU version (NVIDIA GPU, 3-5x faster):
#      docker run -p 8080:8080 --gpus all --name localai -d \
#        localai/localai:latest-aio-gpu-nvidia-cuda-12
#
# 2. Wait for initial setup (5-10 minutes on first run)
#    Models are downloaded automatically
#
# 3. Verify LocalAI is ready:
#      curl http://localhost:8080/v1/models
#
# 4. Configure EmmAI (this file or environment):
#      base_url: http://localhost:8080
#      model: gpt-3.5-turbo
#      api_key: ""  # Empty is OK!
#
#    Or use environment variables:
#      export OPENAI_BASE_URL="http://localhost:8080"
#      export OPENAI_API_KEY=""  # Empty string is fine
#
# 5. Run EmmAI:
#      ./bin/emmai
#
# 6. Verify custom endpoint in status bar:
#      EmmAI - gpt-3.5-turbo (Custom) | Tokens: 0
#                            ^^^^^^^^
#
# Managing Models:
# ---------------
#
# List available models:
#   docker exec localai local-ai models list
#
# Install specific models:
#   docker exec localai local-ai models install llama2
#   docker exec localai local-ai models install mistral
#   docker exec localai local-ai models install codellama
#
# Use installed model:
#   Update config: model: llama-2-7b
#
# Performance Tips:
# ----------------
# - GPU version: 3-5x faster with NVIDIA GPU
# - Smaller models (7B): Faster, less memory
# - Larger models (13B+): Better quality, slower
# - Reduce max_tokens for faster responses
#
# Troubleshooting:
# ---------------
#
# Connection refused:
#   Check container: docker ps
#   Verify endpoint: curl http://localhost:8080/v1/models
#   Restart: docker restart localai
#
# Slow responses:
#   Use GPU-enabled Docker image
#   Try smaller models (7B instead of 13B)
#   Lower max_tokens
#
# Model not found:
#   List models: curl http://localhost:8080/v1/models
#   Use exact model name from list
#
# Out of memory:
#   Use smaller models (7B)
#   Close other applications
#   Increase Docker memory limit
#
# Self-signed certificate errors:
#   Set: insecure_skip_verify: true
#   Or: export OPENAI_INSECURE_SKIP_VERIFY=true
#
# Resources:
# ---------
# Documentation: https://localai.io/basics/getting_started/
# Model Gallery: https://localai.io/models/
# GitHub: https://github.com/mudler/LocalAI
# Discord: https://discord.gg/uJAeKSAGDy
#
# ============================================================================
